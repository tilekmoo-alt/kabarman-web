workflows:
  ios-release:
    name: Kabarman iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app-store-connect
      node: v20
    scripts:
      - name: Install frontend dependencies
        script: cd frontend && npm ci

      - name: Build web app
        script: cd frontend && npm run build

      - name: Install Capacitor
        script: |
          cd frontend
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6

      - name: Add iOS platform
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios
          python3 -c "import re; p='ios/App/App.xcodeproj/project.pbxproj'; c=open(p).read(); c2=re.sub('DEVELOPMENT_TEAM = [^;]*;','DEVELOPMENT_TEAM = DVR5F9DX62;',c); open(p,'w').write(c2); print('DEVELOPMENT_TEAM entries set:',c2.count('DVR5F9DX62'))"

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "kg.kabarman.app" \
            --type IOS_APP_STORE \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "frontend/ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: true
