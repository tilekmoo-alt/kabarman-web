workflows:
  ios-release:
    name: Kabarman iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - manual-signing
      node: v20
    scripts:
      - name: Install frontend dependencies
        script: cd frontend && npm ci

      - name: Build web app
        script: cd frontend && npm run build

      - name: Install Capacitor
        script: |
          cd frontend
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6

      - name: Add iOS platform
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios
          echo "=== DEVELOPMENT_TEAM before sed ==="
          grep -n 'DEVELOPMENT_TEAM\|CODE_SIGN_STYLE' ios/App/App.xcodeproj/project.pbxproj || echo "NOT FOUND"
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = DVR5F9DX62;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = ;/DEVELOPMENT_TEAM = DVR5F9DX62;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          echo "=== DEVELOPMENT_TEAM after sed ==="
          grep -n 'DEVELOPMENT_TEAM\|CODE_SIGN_STYLE' ios/App/App.xcodeproj/project.pbxproj || echo "STILL NOT FOUND"

      - name: Install certificate and profile
        script: |
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          keychain initialize
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CM_CERTIFICATE_PASSWORD
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/kabarman.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          echo $CM_PROVISIONING_PROFILE | base64 --decode > "$PROFILE_PATH"
          echo "=== Profile installed ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Apply signing to project
        script: xcode-project use-profiles --verbose

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "frontend/ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: true
