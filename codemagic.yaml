workflows:
  ios-release:
    name: Kabarman iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app-store-connect
      node: v20
    scripts:
      - name: Install frontend dependencies
        script: cd frontend && npm ci

      - name: Build web app
        script: cd frontend && npm run build

      - name: Install Capacitor
        script: |
          cd frontend
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6

      - name: Add iOS platform
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios
          echo "=== DEVELOPMENT_TEAM before ==="
          grep -n 'DEVELOPMENT_TEAM\|CODE_SIGN_STYLE' ios/App/App.xcodeproj/project.pbxproj || echo "NOT FOUND"
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = DVR5F9DX62;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = ;/DEVELOPMENT_TEAM = DVR5F9DX62;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          echo "=== DEVELOPMENT_TEAM after ==="
          grep -n 'DEVELOPMENT_TEAM\|CODE_SIGN_STYLE' ios/App/App.xcodeproj/project.pbxproj || echo "STILL NOT FOUND"

      - name: Set up code signing
        script: |
          echo "=== Profiles BEFORE fetch ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "Directory empty"
          app-store-connect fetch-signing-files kg.kabarman.app \
            --type IOS_APP_STORE \
            --create
          echo "=== Profiles AFTER fetch ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "Directory still empty"
          xcode-project use-profiles --verbose

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "frontend/ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: true
