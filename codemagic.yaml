workflows:
  ios-release:
    name: Kabarman iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app-store-connect
      node: v20
    scripts:
      - name: Install frontend dependencies
        script: cd frontend && npm ci

      - name: Build web app
        script: cd frontend && npm run build

      - name: Install Capacitor
        script: |
          cd frontend
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6

      - name: Add iOS platform
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios
          echo "=== DEVELOPMENT_TEAM before fix ==="
          grep "DEVELOPMENT_TEAM" ios/App/App.xcodeproj/project.pbxproj || echo "not found"
          python3 -c "
import re
with open('ios/App/App.xcodeproj/project.pbxproj', 'r') as f:
    content = f.read()
content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', 'DEVELOPMENT_TEAM = DVR5F9DX62;', content)
if 'DEVELOPMENT_TEAM' not in content:
    content = content.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Automatic;\n\t\t\t\tDEVELOPMENT_TEAM = DVR5F9DX62;')
with open('ios/App/App.xcodeproj/project.pbxproj', 'w') as f:
    f.write(content)
print('Done')
"
          echo "=== DEVELOPMENT_TEAM after fix ==="
          grep "DEVELOPMENT_TEAM" ios/App/App.xcodeproj/project.pbxproj || echo "still not found"

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "kg.kabarman.app" \
            --type IOS_APP_STORE \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "frontend/ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: true
